name: Deploy interacti admin

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-interacti-admin
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fail in seconds, with a message that names the missing secret, rather
      # than after a full build. An empty SSH_USER makes `ssh "@host"` print
      # its own usage text and exit 255, which says nothing about the cause;
      # an empty SSH_HOST fails a step earlier still.
      - name: Verify deploy secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          missing=
          [ -n "$SSH_HOST" ] || missing="$missing SSH_HOST"
          [ -n "$SSH_USER" ] || missing="$missing SSH_USER"
          [ -n "$SSH_KEY" ]  || missing="$missing SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing or empty repository secrets:$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions." >&2
            exit 1
          fi
          echo "SSH secrets present."

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Test
        run: yarn test

      # The product origins are committed in .env.production, so the build needs
      # no repository variables.
      - name: Build
        run: yarn build

      - name: Install SSH key
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # Upload beside the live release first. Nothing changes for visitors
      # until release.sh repoints the current symlink.
      - name: Upload release
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/id_deploy" \
            dist/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/srv/interacti-admin/releases/$GITHUB_SHA/"
          rsync -az -e "ssh -i ~/.ssh/id_deploy" \
            deploy/release.sh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/srv/interacti-admin/release.sh"

      - name: Release
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "bash /srv/interacti-admin/release.sh $GITHUB_SHA"
